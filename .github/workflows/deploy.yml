name: Pubblica il rinvio su GitHub Pages

# Il sito vero è passato a Cloudflare Pages, che lo costruisce da sé a ogni
# push. Qui resta solo il congedo: GitHub Pages continua a rispondere al
# vecchio indirizzo, ma serve la pagina di rinvio in `legacy/` e il service
# worker che smonta la vecchia app installata.
#
# È il pezzo che si dimentica in ogni trasloco. Senza, chi aveva aggiunto il
# sito alla schermata iniziale del telefono continuerebbe ad aprire la
# versione vecchia dalla cache — per sempre, senza un solo segnale che il sito
# si è spostato.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Nessuna build: sono tre file statici. Non c'è nemmeno il cancello dei
      # test, perché non c'è più niente da rompere — la pagina di rinvio non
      # dipende dal contenuto del sito.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: legacy

      - id: deployment
        uses: actions/deploy-pages@v4
